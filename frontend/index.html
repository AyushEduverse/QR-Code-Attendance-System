<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Attendance System</title>
    <!-- Material UI Fonts and Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
    <style>
        .fade-out {
            animation: fadeOut 2s forwards;
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-20px); }
        }

        .slide-up-fade-out {
            animation: slideUpAndFadeOut 2s forwards;
        }

        @keyframes slideUpAndFadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-50px); }
        }

        .attendance-success-animation {
            font-size: 3em;
            color: #28a745;
            animation: popIn 0.5s ease-out forwards;
            display: none; /* Hidden by default */
            margin-top: 20px;
        }

        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .session-end-message {
            font-size: 1.5em;
            color: #007bff;
            margin-top: 15px;
            display: none;
            animation: fadeIn 1s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>QR Code Attendance</h1>
        <form id="attendance-form">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="roll-number">Roll Number:</label>
                <input type="text" id="roll-number" required>
            </div>
            <input type="hidden" id="qr-data">
            <button type="submit">Submit Attendance</button>
        </form>
        <p id="message" style="color: green;"></p>
        <div id="attendance-animation" class="attendance-success-animation"><i class="material-icons">check_circle</i></div>
        <p id="session-end-message" class="session-end-message">Session Ended. Thank you!</p>
    </div>

    <!-- Custom Script -->
    <script src="script.js"></script>
</body>
</html>
